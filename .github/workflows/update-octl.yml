name: update-octl

# Keep Formula/octl.rb in sync with the latest gotry-io/Octopus release, with no cross-repo credentials:
# this runs in the tap and pushes with the tap's own GITHUB_TOKEN. Octopus only builds + publishes the
# release; the formula follows on the next scheduled run (or trigger this manually for an instant bump).
on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-octl
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync octl formula to the latest Octopus release
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: gotry-io/Octopus
        run: |
          set -euo pipefail
          # Latest published release (tag + assets). No release yet => nothing to do.
          REL="$(gh release view --repo "$SRC" --json tagName,assets 2>/dev/null || true)"
          if [ -z "$REL" ]; then echo "no published release on $SRC yet"; exit 0; fi
          TAG="$(jq -r .tagName <<<"$REL")"
          VERSION="${TAG#v}"
          URL="$(jq -r '.assets[] | select(.name|test("macos-arm64\\.tar\\.gz$")) | .url' <<<"$REL" | head -n1)"
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then echo "no macos-arm64 asset in $TAG"; exit 0; fi

          if grep -q "version \"${VERSION}\"" Formula/octl.rb; then
            echo "formula already at ${VERSION}"; exit 0
          fi

          TMP="$(mktemp)"
          curl -fsSL "$URL" -o "$TMP"
          SHA="$(sha256sum "$TMP" | cut -d' ' -f1)"

          sed -E -i \
            -e "s|^([[:space:]]*version )\"[^\"]*\"|\1\"${VERSION}\"|" \
            -e "s|^([[:space:]]*url )\"[^\"]*\"|\1\"${URL}\"|" \
            -e "s|^([[:space:]]*sha256 )\"[^\"]*\"|\1\"${SHA}\"|" \
            Formula/octl.rb
          grep -qF "version \"${VERSION}\"" Formula/octl.rb || { echo "version not applied"; exit 1; }
          grep -qF "sha256 \"${SHA}\"" Formula/octl.rb || { echo "sha256 not applied"; exit 1; }

          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "octl ${VERSION}"
          git push
